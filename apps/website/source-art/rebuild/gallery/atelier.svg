<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1800" height="1200" viewBox="0 0 1800 1200"><defs><linearGradient id="veil"><stop stop-color="#f0e9dc"/><stop offset=".72" stop-color="#f0e9dc" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="1800" height="1200" rx="0" fill="#f4f2e9" /><rect x="0" y="0" width="1800" height="82" rx="0" fill="#faf9f4" /><circle cx="36" cy="41" r="8" fill="#c5c8bc"/><circle cx="62" cy="41" r="8" fill="#d5d8ce"/><circle cx="88" cy="41" r="8" fill="#e2e4dc"/><text x="130" y="50" font-size="23" fill="#343a31" font-family="Arial" font-weight="600">Atelier</text><text x="1540" y="49" font-size="18" fill="#858c7c" font-family="Arial" font-weight="600">MORROW</text><path d="M0,82L1800,82" stroke="#dfdfd5" stroke-width="2"/><rect x="90" y="143" width="440" height="974" rx="8" fill="#e8e4da" /><text x="128" y="214" font-size="17" fill="#969182" font-family="Arial" font-weight="400">YOUR STORIES</text><rect x="117" y="251" width="386" height="113" rx="7" fill="#f7f4eb" /><text x="138" y="298" font-size="24" fill="#4f4b41" font-family="Georgia" font-weight="400">A story worth telling</text><text x="140" y="334" font-size="17" fill="#918978" font-family="Arial" font-weight="400">In progress</text><rect x="117" y="389" width="386" height="113" rx="7" fill="#e8e4da" /><text x="138" y="436" font-size="24" fill="#4f4b41" font-family="Georgia" font-weight="400">Fragments &amp; notes</text><text x="140" y="472" font-size="17" fill="#918978" font-family="Arial" font-weight="400">Notebook</text><rect x="117" y="527" width="386" height="113" rx="7" fill="#e8e4da" /><text x="138" y="574" font-size="24" fill="#4f4b41" font-family="Georgia" font-weight="400">The places between</text><text x="140" y="610" font-size="17" fill="#918978" font-family="Arial" font-weight="400">Notebook</text><rect x="117" y="665" width="386" height="113" rx="7" fill="#e8e4da" /><text x="138" y="712" font-size="24" fill="#4f4b41" font-family="Georgia" font-weight="400">Something new</text><text x="140" y="748" font-size="17" fill="#918978" font-family="Arial" font-weight="400">Notebook</text><text x="620" y="192" font-size="17" fill="#9c9585" font-family="Arial" font-weight="400">DRAFT 01 / A PLACE TO BEGIN</text><text x="620" y="302" font-size="68" fill="#393c32" font-family="Georgia" font-weight="400">The places between.</text><text x="620" y="375" font-size="27" fill="#898574" font-family="Georgia" font-weight="400">Every story begins with a little attention.</text><path d="M620,422L1650,422" stroke="#d4d1c6" stroke-width="2"/><text x="620" y="502" font-size="27" fill="#6e6f60" font-family="Georgia" font-weight="400">The morning arrived slowly, carrying the scent of rain.</text><text x="620" y="556" font-size="27" fill="#6e6f60" font-family="Georgia" font-weight="400">Beyond the open window, the garden was still.</text><text x="620" y="610" font-size="27" fill="#6e6f60" font-family="Georgia" font-weight="400">She left the page open and listened.</text><text x="620" y="664" font-size="27" fill="#6e6f60" font-family="Georgia" font-weight="400"></text><text x="620" y="718" font-size="27" fill="#6e6f60" font-family="Georgia" font-weight="400">Some ideas need a quiet place to find their shape.</text><text x="620" y="772" font-size="27" fill="#6e6f60" font-family="Georgia" font-weight="400">A sentence. A moment. A detail you almost missed.</text><text x="620" y="826" font-size="27" fill="#6e6f60" font-family="Georgia" font-weight="400">Start there.</text><rect x="620" y="940" width="1030" height="127" rx="14" fill="#edeee2" /><text x="652" y="985" font-size="25" fill="#56624b" font-family="Georgia" font-weight="400">A second pair of eyes</text><text x="653" y="1026" font-size="21" fill="#8d947e" font-family="Arial" font-weight="400">Explore a direction, refine a paragraph, or keep writing.</text><text x="622" y="1130" font-size="16" fill="#9b9b88" font-family="Arial" font-weight="400">WORDS, IN YOUR OWN VOICE.</text></svg>